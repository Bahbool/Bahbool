<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Plate Scanner 2077 — Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --cy: #00ffe1; --bg: #0a0a0a; --dim:#008888; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Orbitron', monospace; background:#000; color:var(--cy);
         display:flex; flex-direction:column; align-items:center; min-height:100vh;
         background-image: radial-gradient(circle at top center, #121212 0%, #000000 100%); }

  .wrap { width:95%; max-width:1100px; margin:32px auto; display:grid; gap:24px; grid-template-columns:1fr; }
  .card { border:1px solid var(--cy); border-radius:12px; padding:20px; background:rgba(0,255,255,0.08); box-shadow:0 0 20px rgba(0,255,255,0.3); }
  h2 { margin:0 0 16px; text-shadow:0 0 10px var(--cy); }
  input[type="file"], button { width:100%; border:2px solid var(--cy); background:#000; color:var(--cy); padding:10px; border-radius:8px; }
  button:hover { background:var(--cy); color:#000; }
  #progressWrapper { display:none; width:100%; height:18px; border:1px solid var(--cy); border-radius:8px; margin-top:10px; }
  #progressBar { width:0%; height:100%; background:linear-gradient(90deg, #00ffe1, #00ccff); color:#000; text-align:center; border-radius:8px; font-weight:bold; }

  /* Live table */
  table { width:100%; border-collapse:collapse; }
  th, td { border-bottom:1px dashed rgba(0,255,255,0.3); padding:8px 10px; text-align:left; font-size:14px; }
  tr.match-wanted { background:rgba(255,0,0,0.15); }
  tr.match-registered { background:rgba(0,255,0,0.12); }
  .small { color:var(--dim); font-size:12px; }
  .thumb { height:40px; border:1px solid var(--cy); border-radius:6px; }

  /* Popup alert */
  #alertOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.75); z-index:9999; }
  .alertBox { border:2px solid #ff2e2e; background:#1a0000; color:#fff; padding:24px; border-radius:14px; box-shadow:0 0 40px #ff2e2e; text-align:center; }
  .alertBox h3 { margin:0 0 8px; color:#ff6666; }
  .alertBox p { margin:6px 0; }
  .footer { text-align:center; color:var(--dim); margin:14px 0 30px; }
  @media(min-width:900px){ .wrap{ grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<div class="wrap">

  <!-- UPLOAD SCAN (kept from your original flow) -->
  <div class="card">
    <h2>Upload Scan</h2>
    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" name="image" accept="image/*" required />
      <button type="submit">Start Scan</button>
    </form>
    <div id="progressWrapper"><div id="progressBar">0%</div></div>
    <div id="result" class="small"></div>
  </div>

  <!-- LIVE DETECTIONS -->
  <div class="card">
    <h2>Live Detections</h2>
    <div class="small" id="liveStatus">Polling…</div>
    <table id="logTable">
      <thead>
        <tr>
          <th>ID</th><th>Plate</th><th>Conf</th><th>When</th><th>Type</th><th>Image</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<div id="alertOverlay">
  <div class="alertBox">
    <h3>⚠ ALERT: MATCH DETECTED</h3>
    <p id="alertPlate" style="font-size:22px; letter-spacing:1px;"></p>
    <p class="small" id="alertType"></p>
    <button onclick="hideAlert()">OK</button>
  </div>
</div>

<div class="footer">CYBER-SEC // SYSTEM ONLINE 2025</div>

<script>
 // ------- Upload Scan (same behavior, posts to uploads.php) -------
 const form = document.getElementById("uploadForm");
 const progressWrapper = document.getElementById("progressWrapper");
 const progressBar = document.getElementById("progressBar");
 const result = document.getElementById("result");

 form.addEventListener("submit", function(e){
   e.preventDefault();
   const fd = new FormData(form);
   result.textContent = "";
   progressWrapper.style.display = "block";
   progressBar.style.width = "0%"; progressBar.textContent = "0%";

   let prog = 0;
   const fake = setInterval(()=>{
     if (prog < 95) { prog += Math.random()*7+2; if (prog>95) prog=95; }
     progressBar.style.width = Math.round(prog)+"%";
     progressBar.textContent = Math.round(prog)+"%";
   }, 160);

   const xhr = new XMLHttpRequest();
   xhr.open("POST","uploads.php",true);
   xhr.onload = ()=>{ clearInterval(fake); progressBar.style.width="100%"; progressBar.textContent="100%"; result.innerHTML = xhr.responseText; };
   xhr.onerror = ()=>{ clearInterval(fake); progressBar.style.width="0%"; result.innerHTML = "<span style='color:red'>SYSTEM ERROR: Scan Failed</span>"; };
   xhr.send(fd);
 });

 // ------- Live Detections poller -------
 const API = "api_detections.php";
 const tbody = document.querySelector("#logTable tbody");
 const liveStatus = document.getElementById("liveStatus");
 let lastSeenId = 0;
 let notified = new Set();

 function playBeep(){
   try {
     const ctx = new (window.AudioContext || window.webkitAudioContext)();
     const o = ctx.createOscillator(); const g = ctx.createGain();
     o.connect(g); g.connect(ctx.destination);
     o.type = "square"; o.frequency.setValueAtTime(880, ctx.currentTime);
     g.gain.setValueAtTime(0.2, ctx.currentTime);
     o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 300);
   } catch {}
 }

 function showAlert(plate, type){
   document.getElementById("alertPlate").textContent = plate;
   document.getElementById("alertType").textContent = type ? ("Type: "+type) : "";
   document.getElementById("alertOverlay").style.display = "flex";
   playBeep();
 }

 function hideAlert(){ document.getElementById("alertOverlay").style.display = "none"; }

 async function poll(){
   try {
     const res = await fetch(API + "?limit=50", {cache:"no-store"});
     const js = await res.json();
     if(!js.ok){ liveStatus.textContent = "API error"; return; }
     liveStatus.textContent = "Online";
     renderRows(js.rows);
   } catch(e){
     liveStatus.textContent = "Disconnected";
   }
 }

 function renderRows(rows){
   // newest first in API; render top-down
   tbody.innerHTML = "";
   rows.forEach(r=>{
     const tr = document.createElement("tr");
     if (r.is_match && r.match_type === "wanted") tr.className = "match-wanted";
     else if (r.is_match) tr.className = "match-registered";

     const img = document.createElement("img");
     img.src = r.frame_path; img.className = "thumb"; img.loading = "lazy";

     tr.innerHTML = `
       <td>${r.id}</td>
       <td>${r.plate_text}</td>
       <td>${(+r.ocr_conf).toFixed(2)}</td>
       <td class="small">${r.detected_at || ""}</td>
       <td>${r.match_type || ""}</td>
       <td></td>
     `;
     tr.children[5].appendChild(img);
     tbody.appendChild(tr);

     // popup only for fresh unseen matches
     if (r.id > lastSeenId) {
       if (r.is_match && !notified.has(r.id)) {
         showAlert(r.plate_text, r.match_type);
         notified.add(r.id);
       }
     }
     if (r.id > lastSeenId) lastSeenId = r.id;
   });
 }

 setInterval(poll, 2000);
 poll();
</script>
</body>
</html>
